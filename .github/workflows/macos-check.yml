# TEMPORARY: verification workflow for the macOS support branch; removed before the PR.
name: macos-check
on:
  push:
    branches: [feat/macos-support]
  workflow_dispatch:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      HEADROOM_DISABLE_DASHBOARD: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests (stdlib only)
        run: python -m unittest discover -s skills/headroom/tests -p "test_*.py" -v
      - name: Node test (default interpreter lookup)
        run: node skills/headroom/tests/test_dashboard_mood.js
      - name: End-to-end installer + hooks in a temporary HOME
        run: python .github/e2e_check.py
      - name: Desktop fallback without tray packages (macOS)
        if: runner.os == 'macOS'
        run: python .github/e2e_check.py --desktop-fallback
      - name: Install desktop extras
        run: python -m pip install -r skills/headroom/requirements-desktop.txt
      - name: Unit tests with desktop extras (+ native tray smoke on macOS)
        env:
          HEADROOM_TEST_NATIVE_TRAY: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: python -m unittest discover -s skills/headroom/tests -p "test_*.py" -v
      - name: SessionStart launches the menu bar display (macOS)
        if: runner.os == 'macOS'
        run: python .github/e2e_check.py --desktop
