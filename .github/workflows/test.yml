name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      HEADROOM_DISABLE_DASHBOARD: "1"
      HEADROOM_TEST_PYTHON: python
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Python unit tests (standard library only)
        run: python -m unittest discover -s skills/headroom/tests -p "test_*.py" -v

      - name: Dashboard JavaScript test
        run: node skills/headroom/tests/test_dashboard_mood.js

      # Exercise the optional Windows desktop dependencies once per matrix.
      - name: Install desktop dependencies
        if: runner.os == 'Windows' && matrix.python-version == '3.13'
        run: python -m pip install -r skills/headroom/requirements-desktop.txt

      - name: Verify desktop dependencies are importable
        if: runner.os == 'Windows' && matrix.python-version == '3.13'
        run: python -c "import tkinter, pystray; from PIL import Image"

      - name: Python unit tests with desktop dependencies
        if: runner.os == 'Windows' && matrix.python-version == '3.13'
        run: python -m unittest discover -s skills/headroom/tests -p "test_*.py" -v
